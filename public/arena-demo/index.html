  <body>
    <div id="boot">Loading the recorded season…</div>
    <div id="root"></div>
    <script>
      (function () {
        var boot = document.getElementById('boot');
        var app = document.getElementById('root');
        function done() {
          if (app && app.childElementCount) boot.remove();
        }
        new MutationObserver(done).observe(app, { childList: true });

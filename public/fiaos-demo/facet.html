<!doctype html><html lang="en-AU"><head><script>
(()=>{
  const root=location.pathname.replace(/[^/]*$/, '');
  const here=u=>{
    if(typeof u!=='string')return u;
    if(u.startsWith('/api/')||u.startsWith('/oauth/'))return null;
    if(u.startsWith('/')&&!u.startsWith(root))return root.replace(/\/$/,'')+u;
    return u;
  };
  const orig=window.fetch;
  window.fetch=(input,init)=>{
    const url=typeof input==='string'?input:(input&&input.url);
    const mapped=here(url);
    if(mapped==null)return Promise.resolve(new Response(JSON.stringify({ok:false,xai:false,items:[],notes:[],products:[],episodes:[],error:'No local server in this browser demo.'}),{status:200,headers:{'Content-Type':'application/json'}}));
    if(typeof input==='string')return orig(mapped,init);
    return orig(input,init);
  };
  document.addEventListener('click',e=>{
    const a=e.target.closest&&e.target.closest('a[href^="/"]');
    if(!a)return;
    const href=a.getAttribute('href');
    if(href.startsWith('/api/')||href.startsWith('/oauth/')){e.preventDefault();return}
    e.preventDefault();
    location.href=root.replace(/\/$/,'')+href;
  },true);
})();
</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Facet</title><link rel="stylesheet" href="styles.css">
<style>body{display:block;height:auto;min-height:100vh;padding:18px;max-width:820px;margin:0 auto}button{margin:4px}input{min-height:48px}</style></head>
<body>
<h1 style="color:var(--t)">Facet</h1>
<p>Start page for the Facet browser. Bookmarks and history stay on this machine. For .onion sites, point Facet at Tor’s local SOCKS port. See <code>linux/TOR.md</code>.</p>
<div class="row"><input id="q" placeholder="Search the house"><button type="button" onclick="find()">Search</button></div>
<div id="hits"></div>
<section class="card" id="marks"></section>
<section class="card"><h3>Remember a page</h3><div class="row"><input id="title" placeholder="Title"><input id="url" placeholder="Paste a URL"></div><button type="button" onclick="add()">Bookmark</button><button type="button" onclick="hist()">Add to history</button></section>
<section class="card" id="hist"></section>
<script>
const api=async(u,b)=>{const r=await fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json','X-FiaOS':'1'},body:JSON.stringify(b)}:{});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j};
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function boot(){const d=await api('/api/facet');
 document.getElementById('marks').innerHTML='<h3>Bookmarks</h3>'+d.bookmarks.map(b=>`<p><a href="${esc(b.url)}">${esc(b.title)}</a> <small>${esc(b.group||'')}</small></p>`).join('');
 document.getElementById('hist').innerHTML='<h3>History</h3>'+(d.history.map(h=>`<p><a href="${esc(h.url)}">${esc(h.title)}</a></p>`).join('')||'<p class="mute">Facet can POST /api/facet/history when a page opens.</p>')+'<p class="ex">Tor SOCKS, when tor is running: '+esc(d.tor)+'</p>'}
async function find(){const j=await api('/api/hub/search?q='+encodeURIComponent(document.getElementById('q').value));
 document.getElementById('hits').innerHTML=j.hits.map(h=>`<p><b>${esc(h.title)}</b> <small>${esc(h.kind)}</small><br>${esc(h.snippet||'')}</p>`).join('')||'<p class="mute">Nothing.</p>'}
async function add(){await api('/api/facet/bookmark',{title:document.getElementById('title').value,url:document.getElementById('url').value});boot()}
async function hist(){await api('/api/facet/history',{title:document.getElementById('title').value,url:document.getElementById('url').value});boot()}
boot().catch(e=>{document.body.insertAdjacentHTML('beforeend','<p class="warn">'+esc(e.message)+'</p>')});
</script></body></html>

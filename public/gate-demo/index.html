  <body>
    <div id="boot">Loading the GATE workspace…</div>
    <div id="app"></div>
    <script>
      (function () {
        var boot = document.getElementById('boot');
        var app = document.getElementById('app');
        function done() {
          if (app && app.childElementCount) boot.remove();
        }
        new MutationObserver(done).observe(app, { childList: true });
        window.addEventListener('load', function () { setTimeout(done, 40); });
      })();
    </script>
